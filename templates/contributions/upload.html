{% extends 'base.html' %}{% block content %}<div class="narrow"><p class="eyebrow">Proof of saving</p><h1>{{ contribution.period.month|date:'F Y' }}</h1><p>{{ contribution.period.group.name }} / {{ contribution.period.amount }} RWF / due {{ contribution.period.due_date }}</p><section class="card"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>Submit for approval</button></form></section><a href="{% url 'contribution_detail' contribution.pk %}">Back to contribution</a></div>{% endblock %}
