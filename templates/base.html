<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savings Group Manager</title><style>
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}:root{font-family:system-ui,sans-serif;color:#163c37;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#123f35;color:white;padding:20px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header a{color:white}main{max-width:1050px;margin:48px auto;padding:0 20px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1px;margin-bottom:10px}p{line-height:1.6}.muted{color:#63776f}.card{background:white;border:1px solid #dce6df;border-radius:16px;padding:28px;margin:24px 0;box-shadow:0 6px 24px #123f3505}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#638173}.button,button{display:inline-block;background:#17634d;color:white;padding:12px 18px;border:0;border-radius:8px;font:inherit;text-decoration:none;cursor:pointer}header button{background:#ffffff20;padding:7px 12px}a{color:#17634d}textarea{width:100%;font:inherit;padding:12px;border:1px solid #becdc4;border-radius:7px;display:block}input,select{display:block;padding:12px;width:100%;border:1px solid #becdc4;border-radius:7px;margin-top:7px;font:inherit}form p{margin:20px 0}label{font-weight:600}.helptext{display:block;color:#63776f;font-size:13px;margin-top:6px}.errorlist{color:#ae2d35}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:15px 12px;border-bottom:1px solid #e8ede9;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:#63776f}nav{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.badge{background:#e4f2e9;border-radius:20px;padding:5px 10px;font-size:13px}.narrow{max-width:540px;margin:0 auto}code{word-break:break-all;font-size:18px}footer{padding:30px;text-align:center;color:#63776f;font-size:13px}</style></head><body><header><strong>Savings Group Manager</strong><nav>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Overview</a><a href="{% url 'group_list' %}">Groups</a>{% if can_review_any %}<a href="{% url 'review_queue' %}">Review queue</a>{% endif %}<a href="{% url 'notifications' %}">Notifications</a><a href="{% url 'password_change' %}">Password</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% endif %}</nav></header><main>{% block content %}{% endblock %}</main><footer>Built for shared progress / Currency RWF / Africa/Kigali</footer></body></html>
